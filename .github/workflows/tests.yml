name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"

      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test every supported Python on Linux, plus the oldest, midpoint,
          # and newest versions on Windows/macOS to control CI cost.
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CadQuery pulls in OCP/OpenCASCADE; libGL is needed for headless use on Linux.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  package:
    needs: [lint, pytest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  wheel_smoke:
    name: wheel-smoke (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CadQuery pulls in OCP/OpenCASCADE; libGL is needed for headless use on Linux.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Download distributions built by the package job
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Run clean-wheel CLI and MCP smoke tests
        run: python scripts/wheel_smoke.py --dist-dir dist

  required-checks:
    if: always()
    needs: [lint, pytest, package, wheel_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          WHEEL_SMOKE_RESULT: ${{ needs.wheel_smoke.result }}
        run: |
          for result in "$LINT_RESULT" "$PYTEST_RESULT" "$PACKAGE_RESULT" "$WHEEL_SMOKE_RESULT"; do
            test "$result" = "success"
          done
